<text class="h" x="24" y="69.0">Hey, I'm Swezy! 👋</text>
<line class="rule" x1="24" x2="532" y1="83.0" y2="83.0"/>
<text x="24" y="111.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>I'm a </tspan><tspan class="b">developer and cybersecurity enthusiast from Germany </tspan><tspan>,</tspan></text>
<text x="24" y="135.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>passionate about technology, </tspan><tspan class="b">software development and automation. </tspan><tspan>I've</tspan></text>
<text x="24" y="159.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>been interested in tech since childhood and </tspan><tspan class="b">started coding around the age</tspan></text>
<text x="24" y="183.0" xml:space="preserve"><tspan class="b">of 13/14 </tspan><tspan>.</tspan></text>
<text x="24" y="221.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>I enjoy </tspan><tspan class="b">building tools, bots, scripts and applications that make life</tspan></text>
<text x="24" y="245.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan class="b">easier. </tspan><tspan>My main focus is </tspan><tspan class="b">Python </tspan><tspan>, but I'm also exploring </tspan><tspan class="b">C++ </tspan><tspan>and</tspan></text>
<text x="24" y="269.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>continuously </tspan><tspan class="b">expanding my knowledge across different areas of</tspan></text>
<text x="24" y="293.0" xml:space="preserve"><tspan class="b">software engineering.</tspan></text>
