<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;fill:#1f2328}
.h{font-size:26px;font-weight:600}
.b{font-weight:700}
.l{fill:#0969da}
.rule{stroke:#d1d9e0;stroke-width:1}
@media (prefers-color-scheme:dark){text{fill:#e6edf3}.l{fill:#4493f8}.rule{stroke:#3d444d}}
</style>
<text class="h" x="24" y="48.0">What am I into? 💎</text>
<line class="rule" x1="24" x2="532" y1="62.0" y2="62.0"/>
<text x="24" y="90.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>Beyond development, I'm deeply </tspan><tspan class="b">interested in cybersecurity, reverse</tspan></text>
<text x="24" y="114.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan class="b">engineering, malware analysis and vulnerability research. </tspan><tspan>I enjoy</tspan></text>
<text x="24" y="138.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>understanding how systems work, identifying weaknesses and developing</tspan></text>
<text x="24" y="162.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>tools to investigate and address security issues. I'm comfortable in both</tspan></text>
<text x="24" y="186.0" xml:space="preserve"><tspan class="b">Linux </tspan><tspan>and </tspan><tspan class="b">Windows </tspan><tspan>environments.</tspan></text>
<text x="24" y="224.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>In 2025, my </tspan><tspan class="b">RAT-Vulnerabilities </tspan><tspan>research was used to take down a card</tspan></text>
<text x="24" y="248.0" xml:space="preserve"><tspan>skimming operation targeting hotel management systems ( </tspan><tspan class="l">write-up </tspan><tspan>).</tspan></text>
<text x="24" y="286.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan>I also found and reported an </tspan><tspan class="b">account takeover vulnerability in</tspan></text>
<text x="24" y="310.0" xml:space="preserve" textLength="508" lengthAdjust="spacing"><tspan class="b">Whitepages, </tspan><tspan>a major people-search platform. It has since been patched,</tspan></text>
<text x="24" y="334.0" xml:space="preserve"><tspan>and I published a </tspan><tspan class="l">write-up </tspan><tspan>and a </tspan><tspan class="l">proof of concept </tspan><tspan>for research purposes.</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>